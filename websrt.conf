[program:websrt]
; Online deployment: PKI identity from Let's Encrypt (mirrors the nginx-facing
; cert for websrt.vyidd.com) so browsers trust UDP :4433 directly and
; cert-hash.js advertises CERT_HASH = null (no self-signed pinning).
; certbot must restart the gateway on renewal — deploy hook:
;   /etc/letsencrypt/renewal-hooks/deploy/websrt.sh
;     #!/bin/sh
;     /usr/bin/supervisorctl restart websrt
command=/home/flibb/WebSRT/target/release/websrt-gateway --no-gui --input srt --srt-mode listener --srt-port 9000 --bind 0.0.0.0 --web-bind 0.0.0.0 --latency 1000 --health-port 9090 --cert-mode mkcert --cert-pem /etc/letsencrypt/live/websrt.vyidd.com/fullchain.pem --key-pem /etc/letsencrypt/live/websrt.vyidd.com/privkey.pem
directory=/home/flibb/WebSRT
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/websrt/gateway.err.log
stdout_logfile=/var/log/websrt/gateway.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=RUST_LOG="debug"
