; Production supervisord config for the websrt gateway (front.vyidd.com).
; Deploy: copy to /etc/supervisor/conf.d/websrt.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl restart websrt
;
; Online deployment: PKI identity from Let's Encrypt (mirrors the nginx-facing
; cert for websrt.vyidd.com) so browsers trust udp :4433 directly and
; cert-hash.js advertises CERT_HASH = null (no self-signed pinning).
; The key must be readable by www-data: 0640 root:ssl-cert on
; /etc/letsencrypt/archive/websrt.vyidd.com/privkey*.pem — the certbot deploy
; hook /etc/letsencrypt/renewal-hooks/deploy/restart-websrt.sh re-fixes perms
; on renewal and restarts websrt + cakemix.
[program:websrt]
command=/usr/local/bin/websrt-gateway --input srt --srt-mode listener --srt-port 9000 --bind 0.0.0.0 --wt-port 4433 --health-port 9090 --latency 120 --cert-mode mkcert --cert-pem /etc/letsencrypt/live/websrt.vyidd.com/fullchain.pem --key-pem /etc/letsencrypt/live/websrt.vyidd.com/privkey.pem --web-bind 0.0.0.0 --web-port 8443
directory=/var/www/websrt
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/websrt/gateway.out.log
stderr_logfile=/var/log/websrt/gateway.err.log
environment=RUST_LOG="info"
