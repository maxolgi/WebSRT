[package]
name = "websrt-gateway"
version.workspace = true
edition.workspace = true
default-run = "websrt-gateway"
license = "MPL-2.0"

[features]
sim-loss = ["websrt/sim-loss"]

[dependencies]
websrt = { path = "../websrt" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
bytes.workspace = true
srt-protocol.workspace = true
srt-tokio.workspace = true
wtransport.workspace = true
futures.workspace = true
eframe.workspace = true
axum.workspace = true
axum-server.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
local-ip-address = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "websrt-gateway"
path = "src/main.rs"

[[bin]]
name = "mock_obs"
path = "src/bin/mock_obs.rs"

[[bin]]
name = "wt_echo_client"
path = "src/bin/wt_echo_client.rs"

[dev-dependencies]
async-trait.workspace = true

[[bin]]
name = "wt_hs_probe"
path = "src/bin/wt_hs_probe.rs"
