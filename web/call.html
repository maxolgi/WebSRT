<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/websrt.png" />
    <title>WebSRT — Call</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #111;
        color: #ddd;
        margin: 0;
        height: 100vh;
        overflow: hidden;
        transition: padding-right 0.2s ease;
      }
      body.resizing { transition: none; }
      video, canvas { background: #000; display: block; }
      .ok { color: #6f6; }
      .err { color: #f66; }
      .info { color: #6cf; }
      input, button, select {
        font: inherit; padding: 4px; background: #222; color: #ddd;
        border: 1px solid #444; border-radius: 3px;
      }
      button:hover { background: #333; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.muted { opacity: 0.5; }

      /* ── Pre-join (lobby) ─────────────────────────────────────── */
      #prejoin {
        height: 100vh; box-sizing: border-box;
        display: flex; align-items: center; justify-content: center;
      }
      .prejoin-card {
        background: #181818; border: 1px solid #333; border-radius: 8px;
        padding: 16px; width: min(480px, 92vw); box-sizing: border-box;
      }
      .prejoin-card h1 { font-size: 1.1rem; margin: 0 0 12px 0; }
      #preview {
        width: 100%; aspect-ratio: 16 / 9; object-fit: contain;
        border-radius: 4px; transform: scaleX(-1);
      }
      .prejoin-row {
        display: flex; gap: 8px; align-items: center; margin-top: 10px;
      }
      .prejoin-row label {
        display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
      }
      .prejoin-row select { flex: 1; min-width: 0; }
      #room-name { width: 100%; box-sizing: border-box; }
      #join-btn:not(:disabled) {
        background: #1b5e20; color: #b9f6ca; border-color: #2e7d32;
      }
      #join-btn:not(:disabled):hover { background: #2e7d32; }
      #prejoin-error { color: #f66; font-size: 12px; min-height: 1em; margin-top: 8px; }
      .prejoin-hint { color: #777; font-size: 11px; margin-top: 8px; }

      /* ── Call view ────────────────────────────────────────────── */
      #call { position: fixed; top: 0; left: 0; bottom: 0; right: 0; display: none; }
      #call.active { display: block; }
      #remote-canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain;
      }
      #pip {
        position: absolute; width: 224px; border: 1px solid #333;
        border-radius: 6px; overflow: hidden; cursor: grab; z-index: 10;
        background: #000;
      }
      #pip:active { cursor: grabbing; }
      #pip video { width: 100%; display: block; transform: scaleX(-1); }
      #controls {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center; z-index: 20;
        background: rgba(17, 17, 17, 0.85); border: 1px solid #333;
        border-radius: 24px; padding: 8px 14px;
      }
      #hangup-btn {
        background: #5c1a1a; color: #f6b3b3; border-color: #7f2d2d;
      }
      #hangup-btn:hover { background: #7f2d2d; }
      #call-status {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        font-size: 12px; color: #999; z-index: 20;
        background: rgba(17, 17, 17, 0.7); padding: 2px 10px; border-radius: 10px;
      }
      #pub-stats-text {
        position: absolute; top: 10px; left: 10px; font-size: 12px;
        color: #999; z-index: 20; line-height: 1.6;
      }

      /* Dark-themed thin scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: #444 transparent;
      }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
      *::-webkit-scrollbar-thumb:hover { background: #555; }
      *::-webkit-scrollbar-corner { background: transparent; }

      /* Debug panel overlay (same as stream.html) */
      #debug-root {
        position: fixed; top: 0; right: 0; width: 34vw; height: 100vh;
        background: rgba(17, 17, 17, 0.97); border-left: 1px solid #333;
        z-index: 9999; display: none; flex-direction: column;
        font-size: 12px; box-shadow: -4px 0 16px rgba(0,0,0,0.5);
      }
      #debug-root.visible { display: flex; }
      .debug-resizer {
        position: fixed; top: 0; right: 34vw; width: 7px; height: 100vh;
        cursor: col-resize; z-index: 10001; background: transparent;
        transition: background 0.15s; display: none;
        transform: translateX(50%);
      }
      .debug-resizer.visible { display: block; }
      .debug-resizer:hover, .debug-resizer.dragging { background: transparent; }
      .chart-container { position: relative; height: 120px; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="prejoin">
      <div class="prejoin-card">
        <h1>WebSRT Call</h1>
        <video id="preview" width="640" height="360" muted playsinline></video>
        <div class="prejoin-row">
          <label>room: <input type="text" id="room-name" /></label>
        </div>
        <div class="prejoin-row">
          <label>cam: <select id="camera-select"></select></label>
        </div>
        <div class="prejoin-row">
          <label>mic: <select id="audio-source"></select></label>
        </div>
        <div class="prejoin-row">
          <button id="join-btn" style="flex: 1;">Join Call</button>
        </div>
        <div id="prejoin-error"></div>
        <div class="prejoin-hint">1080p30 &middot; 2 Mbps &middot; Opus &middot; share the room name with the other caller</div>
      </div>
    </div>

    <div id="call">
      <canvas id="remote-canvas" width="640" height="360"></canvas>
      <div id="call-status"></div>
      <div class="pub-stats" id="pub-stats-text"></div>
      <div id="pip"></div>
      <div id="controls">
        <button id="mic-btn">mic on</button>
        <button id="cam-btn">cam on</button>
        <button id="speaker-btn">audio on</button>
        <button id="debug-toggle">debug</button>
        <button id="hangup-btn">hang up</button>
      </div>
    </div>

    <div id="debug-root"></div>
    <script src="/cert-hash.js"></script>
    <script type="module" src="/src/call.tsx"></script>
  </body>
</html>
